<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="title desc">
  <title id="title">How goal vectors combine: orthogonal, opposing, and aligned</title>
  <desc id="desc">Three panels showing how goals add up as vectors. Left: Orthogonal goals in independent dimensions (like career and health) combine without canceling each other out. Middle: Opposing goals along the same axis pull in opposite directions, spending maximum energy for near-zero net movement. Right: Aligned goals reinforce each other to create a longer combined vector.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #1f2328; }
    .heading { font-size: 24px; font-weight: 700; }
    .panel-title { font-size: 18px; font-weight: 700; }
    .muted { fill: #59636e; font-size: 14px; }
    .caption { fill: #59636e; font-size: 15px; }
    .panel { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 2; }
    .grid { stroke: #d1d9e0; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .vec-blue { stroke: #0969da; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .vec-green { stroke: #1a7f37; stroke-width: 4; fill: none; stroke-linecap: round; }
    .vec-red { stroke: #cf222e; stroke-width: 3.5; fill: none; stroke-linecap: round; }
    .fill-blue { fill: #0969da; }
    .fill-green { fill: #1a7f37; }
    .fill-red { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted, .caption { fill: #9198a1; }
      .panel { fill: #151b23; stroke: #3d444d; }
      .grid { stroke: #3d444d; }
      .vec-blue { stroke: #4493f8; }
      .vec-green { stroke: #3fb950; }
      .vec-red { stroke: #f85149; }
      .fill-blue { fill: #4493f8; }
      .fill-green { fill: #3fb950; }
      .fill-red { fill: #f85149; }
    }
  </style>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="fill-blue" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="fill-green" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="fill-red" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="heading" x="490" y="38" text-anchor="middle">How goal vectors combine</text>

  <!-- Panel 1: Orthogonal Goals -->
  <g transform="translate(25, 65)">
    <rect class="panel" x="0" y="0" width="290" height="310" rx="14"/>
    <text class="panel-title" x="145" y="34" text-anchor="middle">1. Orthogonal Goals</text>
    <text class="muted" x="145" y="56" text-anchor="middle">Independent dimensions (a · b = 0)</text>

    <!-- Dashed parallelogram lines -->
    <line class="grid" x1="70" y1="115" x2="210" y2="115"/>
    <line class="grid" x1="210" y1="225" x2="210" y2="115"/>

    <!-- Goal B (up) -->
    <line class="vec-blue" x1="70" y1="225" x2="70" y2="122" marker-end="url(#arr-blue)"/>
    <text class="fill-blue" x="62" y="104" text-anchor="start">Goal B (Health)</text>

    <!-- Goal A (right) -->
    <line class="vec-blue" x1="70" y1="225" x2="203" y2="225" marker-end="url(#arr-blue)"/>
    <text class="fill-blue" x="145" y="250" text-anchor="middle">Goal A (Career)</text>

    <!-- Sum vector (diagonal) -->
    <line class="vec-green" x1="70" y1="225" x2="203" y2="120" marker-end="url(#arr-green)"/>
    <text class="fill-green" x="172" y="176" font-weight="600">Net progress</text>

    <circle class="fill-blue" cx="70" cy="225" r="4"/>
    <text class="muted" x="145" y="290" text-anchor="middle">Both advance without canceling out</text>
  </g>

  <!-- Panel 2: Opposing Goals -->
  <g transform="translate(345, 65)">
    <rect class="panel" x="0" y="0" width="290" height="310" rx="14"/>
    <text class="panel-title" x="145" y="34" text-anchor="middle">2. Opposing Goals</text>
    <text class="muted" x="145" y="56" text-anchor="middle">Pulling against each other (a · b &lt; 0)</text>

    <!-- Goal A (right) -->
    <line class="vec-blue" x1="145" y1="160" x2="245" y2="160" marker-end="url(#arr-blue)"/>
    <text class="fill-blue" x="200" y="142" text-anchor="middle">Goal A</text>

    <!-- Goal B (left) -->
    <line class="vec-red" x1="145" y1="176" x2="45" y2="176" marker-end="url(#arr-red)"/>
    <text class="fill-red" x="90" y="202" text-anchor="middle">Goal B</text>

    <!-- Center dot -->
    <circle class="fill-red" cx="145" cy="168" r="5"/>
    <text class="fill-red" x="145" y="238" text-anchor="middle" font-weight="600">Net movement ≈ 0</text>

    <text class="muted" x="145" y="290" text-anchor="middle">High effort, stuck in the same spot</text>
  </g>

  <!-- Panel 3: Aligned / Synergistic Goals -->
  <g transform="translate(665, 65)">
    <rect class="panel" x="0" y="0" width="290" height="310" rx="14"/>
    <text class="panel-title" x="145" y="34" text-anchor="middle">3. Aligned Goals</text>
    <text class="muted" x="145" y="56" text-anchor="middle">Reinforcing directions (a · b &gt; 0)</text>

    <!-- Goal A -->
    <line class="vec-blue" x1="50" y1="220" x2="135" y2="172" marker-end="url(#arr-blue)"/>
    <text class="fill-blue" x="87" y="185" text-anchor="middle" transform="rotate(-29.5 87 185)">Goal A</text>

    <!-- Goal B (from tip of A) -->
    <line class="vec-blue" x1="142" y1="168" x2="230" y2="118" marker-end="url(#arr-blue)"/>
    <text class="fill-blue" x="180" y="132" text-anchor="middle" transform="rotate(-29.5 180 132)">Goal B</text>

    <!-- Combined Net Vector (slightly offset below) -->
    <line class="vec-green" x1="55" y1="234" x2="235" y2="132" marker-end="url(#arr-green)"/>
    <text class="fill-green" x="153" y="200" text-anchor="middle" font-weight="600" transform="rotate(-29.5 153 200)">Compounded</text>

    <circle class="fill-blue" cx="50" cy="220" r="4"/>
    <text class="muted" x="145" y="290" text-anchor="middle">Steps in one help the other</text>
  </g>

  <text class="caption" x="490" y="405" text-anchor="middle">In a high-dimensional space, you don't need just one goal. You just need vectors that don't cancel out.</text>
</svg>
