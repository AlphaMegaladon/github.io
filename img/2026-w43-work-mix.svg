<title id="mix-title">Illustrative exploration and exploitation time splits</title>
<desc id="mix-description">Four illustrative scenarios show exploration and exploitation as complementary shares of working time. Researcher: 50 to 80 percent exploration and 20 to 50 percent exploitation. Software engineer: 20 to 40 and 60 to 80 percent. Tradesperson: 10 to 20 and 80 to 90 percent. Author in a new company: personal estimate of 30 to 50 and 50 to 70 percent, with exploration sometimes higher. Other rows are invented examples, not measured averages. Bars show midpoints; whiskers show assumed ranges, not statistical confidence intervals.</desc>
