<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390" role="img" aria-labelledby="t">
  <title id="t">The wheel: with cash, sell PUTs until you get the shares; with shares, sell CALLs until they are sold; repeat</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; fill: #1f2328; }
    .h { font-size: 22px; font-weight: 700; }
    .b { font-weight: 600; }
    .m { fill: #59636e; }
    .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 2; }
    .put { stroke: #0969da; stroke-width: 3; fill: none; }
    .call { stroke: #1a7f37; stroke-width: 3; fill: none; }
    .tp { fill: #0969da; }
    .tc { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .put { stroke: #4493f8; }
      .call { stroke: #3fb950; }
      .tp { fill: #4493f8; }
      .tc { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="tp" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path class="tc" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="box" x="230" y="180" width="180" height="80" rx="12"/>
  <text x="320" y="216" class="h" text-anchor="middle">CASH</text>
  <text x="320" y="242" class="m" text-anchor="middle">start here</text>

  <rect class="box" x="590" y="180" width="180" height="80" rx="12"/>
  <text x="680" y="216" class="h" text-anchor="middle">SHARES</text>
  <text x="680" y="242" class="m" text-anchor="middle">100 per contract</text>

  <path class="put" d="M320,180 C320,40 680,40 680,180" marker-end="url(#ap)"/>
  <text x="500" y="116" class="b tp" text-anchor="middle">Sell a PUT, collect premium</text>
  <text x="500" y="140" text-anchor="middle">Price below strike → buy shares</text>

  <path class="call" d="M680,260 C680,400 320,400 320,260" marker-end="url(#ac)"/>
  <text x="500" y="304" class="b tc" text-anchor="middle">Sell a CALL, collect premium</text>
  <text x="500" y="328" text-anchor="middle">Price above strike → sell shares</text>

  <path class="put" d="M230,205 C160,170 160,270 230,235" marker-end="url(#ap)"/>
  <text x="165" y="204" text-anchor="end">Price above strike:</text>
  <text x="165" y="226" text-anchor="end">keep premium,</text>
  <text x="165" y="248" text-anchor="end">sell next PUT</text>

  <path class="call" d="M770,235 C840,270 840,170 770,205" marker-end="url(#ac)"/>
  <text x="835" y="204">Price below strike:</text>
  <text x="835" y="226">keep premium,</text>
  <text x="835" y="248">sell next CALL</text>
</svg>
